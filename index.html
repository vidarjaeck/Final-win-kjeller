function normalizeText(v){return (v||"").toString().toLowerCase().trim();}
function parsePriceValue(v){
  if(v===null||v===undefined)return null;
  var n=parseFloat((v+"").replace(",",".").replace(/[^0-9.]/g,""));
  return isNaN(n)?null:n;
}
function compressImage(file,maxWidth,quality){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var ratio=Math.min(1,maxWidth/(img.width||maxWidth));
        var canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*ratio));
        canvas.height=Math.max(1,Math.round(img.height*ratio));
        var ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL(file.type==="image/png"?"image/png":"image/jpeg",quality||0.78));
      };
      img.onerror=function(){reject(new Error("Kunne ikke laste bilde."));};
      img.src=reader.result;
    };
    reader.onerror=function(){reject(new Error("Kunne ikke lese bilde."));};
    reader.readAsDataURL(file);
  });
}
function buildNotifications(wines){
  var out=[];
  wines.forEach(function(w){
    var st=drinkWindowStatus(w);
    if(st.label==="Prime") out.push({wineId:w.id,color:"#a78bfa",text:(w.name||"Ukjent vin")+" er nå i PRIME-status."});
    if(st.label==="Klar"||st.label==="Drink nå") out.push({wineId:w.id,color:"#34d399",text:(w.name||"Ukjent vin")+" er klar til drikking."});
    var until=parseInt(w.drink_until);
    if(until&&until>=currentYear&&until<=currentYear+1) out.push({wineId:w.id,color:"#fb923c",text:(w.name||"Ukjent vin")+" går snart ut av drikkevindu ("+until+")."});
  });
  return out.slice(0,8);
}

function drinkWindowStatus(w){
  var f=parseInt(w.drink_from),u=parseInt(w.drink_until);
  if(!f||!u) return {label:"Ukjent",color:"#9ca3af"};
  if(currentYear<f) return {label:"For ung",color:"#60a5fa"};
  if(currentYear>u) return {label:"Passert",color:"#f87171"};
  var pct=(currentYear-f)/(u-f);
  if(pct<0.4) return {label:"Klar",color:"#34d399"};
  if(pct<0.75) return {label:"Prime",color:"#a78bfa"};
  return {label:"Drink nå",color:"#fb923c"};
}

function groupWines(wines){
  var g={};
  wines.forEach(function(w){
    var type=w.type||"Annet",country=w.country||"Ukjent",region=w.region||"Ukjent",sub=w.subregion||"";
    if(!g[type])g[type]={};if(!g[type][country])g[type][country]={};
    if(!g[type][country][region])g[type][country][region]={};
    if(!g[type][country][region][sub])g[type][country][region][sub]=[];
    g[type][country][region][sub].push(w);
  });
  return g;
}

async function callClaude(sys,msgs,mt){
  var r=await fetch(EDGE_FN_URL,{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+SUPABASE_ANON_KEY,"apikey":SUPABASE_ANON_KEY},
    body:JSON.stringify({system:sys,messages:msgs,max_tokens:mt||500})
  });
  if(!r.ok) throw new Error("Edge function feil: "+r.status);
  var d=await r.json();
  if(d.error) throw new Error(d.error);
  return d.content[0].text;
}

          <div style=${{fontSize:48,marginBottom:8}}>${"\uD83D\uDC64"}</div>
          <div style=${{fontSize:18,fontWeight:700}}>${profile?profile.display_name:"..."}</div>
          <div style=${{color:"#a78bfa",fontSize:13}}>${session.user.email}</div>
        </div>
        <div style=${{padding:14,background:"rgba(255,255,255,0.03)",border:"1px solid #2a1a3a",borderRadius:12,marginBottom:16}}>
          <div style=${{fontSize:13,fontWeight:600,marginBottom:8}}>Kjelleren din</div>
          <div style=${{display:"flex",justifyContent:"center",marginBottom:12}}>
            <div style=${{fontSize:36,fontWeight:700,color:"#a78bfa"}}>${totalBottles}</div>
            <div style=${{color:"#9ca3af",fontSize:13,marginLeft:8,alignSelf:"flex-end",paddingBottom:4}}>flasker totalt</div>
          </div>
          <div style=${{fontSize:13,fontWeight:600,marginBottom:8}}>Fordeling</div>
          <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,fontSize:13}}>
            ${TYPE_ORDER.filter(function(t){return typeCounts[t]}).map(function(t){return html`<div key=${t} style=${{padding:10,background:"rgba(255,255,255,0.04)",borderRadius:8,textAlign:"center",borderLeft:"3px solid "+(typeColors[t]||"#6b7280")}}>
              <div style=${{fontSize:20,fontWeight:700,color:typeColors[t]||"#6b7280"}}>${typeCounts[t]}</div>
              <div style=${{color:"#9ca3af",fontSize:11}}>${t}</div>
            </div>`})}
          </div>
        </div>
        <div style=${{padding:14,background:"rgba(255,255,255,0.03)",border:"1px solid #2a1a3a",borderRadius:12,marginBottom:16}}>
          <div style=${{fontSize:13,fontWeight:600,marginBottom:8}}>Geografi</div>
          <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:13}}>
            <div style=${{padding:10,background:"rgba(124,58,237,0.1)",borderRadius:8,textAlign:"center"}}><div style=${{fontSize:24,fontWeight:700,color:"#a78bfa"}}>${statC}</div><div style=${{color:"#9ca3af",fontSize:11}}>Land</div></div>
            <div style=${{padding:10,background:"rgba(124,58,237,0.1)",borderRadius:8,textAlign:"center"}}><div style=${{fontSize:24,fontWeight:700,color:"#a78bfa"}}>${statR}</div><div style=${{color:"#9ca3af",fontSize:11}}>Regioner</div></div>
          </div>
        </div>
        <div style=${{padding:14,background:"rgba(255,255,255,0.03)",border:"1px solid #2a1a3a",borderRadius:12,marginBottom:16}}>
          <div style=${{fontSize:13,fontWeight:600,marginBottom:8}}>Gjennomsnittlig rating (type)</div>
          ${avgTypeRows.length===0?html`<div style=${{fontSize:12,color:"#6b7280"}}>Ingen ratingdata ennå.</div>`:avgTypeRows.map(function(r){return html`<div key=${r.key} style=${{marginBottom:6}}>
            <div style=${{display:"flex",justifyContent:"space-between",fontSize:12}}><span>${r.key}</span><span style=${{color:"#a78bfa"}}>${r.val}</span></div>
            <div style=${{height:6,background:"#1e1228",borderRadius:999}}><div style=${{height:"100%",width:Math.max(4,Math.min(100,r.val))+"%",background:"#a78bfa",borderRadius:999}}></div></div>
          </div>`})}
          <div style=${{fontSize:13,fontWeight:600,marginTop:10,marginBottom:8}}>Topp regioner (rating)</div>
          ${avgRegionRows.map(function(r){return html`<div key=${r.key} style=${{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style=${{color:"#9ca3af"}}>${r.key}</span><span>${r.val}</span></div>`})}
        </div>
        <div style=${{padding:14,background:"rgba(255,255,255,0.03)",border:"1px solid #2a1a3a",borderRadius:12,marginBottom:16}}>
          <div style=${{fontSize:13,fontWeight:600,marginBottom:8}}>Mest populære produsenter</div>
          ${producerRows.map(function(r){return html`<div key=${r.key} style=${{marginBottom:6}}>
            <div style=${{display:"flex",justifyContent:"space-between",fontSize:12}}><span style=${{color:"#9ca3af"}}>${r.key}</span><span>${r.val} fl</span></div>
            <div style=${{height:6,background:"#1e1228",borderRadius:999}}><div style=${{height:"100%",width:(producerRows[0]?Math.max(6,(r.val/producerRows[0].val)*100):0)+"%",background:"#34d399",borderRadius:999}}></div></div>
          </div>`})}
        </div>
        <div style=${{padding:14,background:"rgba(255,255,255,0.03)",border:"1px solid #2a1a3a",borderRadius:12,marginBottom:16}}>
          <div style=${{fontSize:13,fontWeight:600,marginBottom:8}}>Prisanalyse trend (snitt per årgang)</div>
          ${vintageRows.length===0?html`<div style=${{fontSize:12,color:"#6b7280"}}>Ingen prisdata ennå.</div>`:html`<div style=${{display:"flex",alignItems:"flex-end",gap:6,height:110}}>
            ${vintageRows.map(function(v){var max=vintageRows.reduce(function(m,n){return Math.max(m,n.val)},1);return html`<div key=${v.key} style=${{flex:1,textAlign:"center"}}>
              <div style=${{height:Math.max(8,(v.val/max)*80),background:"linear-gradient(180deg,#60a5fa,#2563eb)",borderRadius:"6px 6px 0 0"}}></div>
              <div style=${{fontSize:10,color:"#9ca3af",marginTop:4}}>${String(v.key).slice(-2)}</div>
            </div>`})}
          </div>`}
        </div>
        <button onClick=${logout} style=${{width:"100%",padding:14,borderRadius:12,background:"rgba(248,113,113,0.1)",border:"1px solid rgba(248,113,113,0.27)",color:"#f87171",fontSize:15,fontWeight:600,cursor:"pointer"}}>Logg ut</button>
      </div>`}
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
